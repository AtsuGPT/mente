# PostgreSQL para desenvolvimento local: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: minhamente
      POSTGRES_PASSWORD: minhamente_dev
      POSTGRES_DB: minhamente
    ports:
      - "5432:5432"
    volumes:
      - minhamente-data:/var/lib/postgresql/data

volumes:
  minhamente-data:
